<!-- Shared lift mark, 1024 x 1024 artboard, transparent background. -->
<g id="mark">
  <defs>
    <linearGradient id="doors" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B3C0D4"/>
      <stop offset="1" stop-color="#7A89A3"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-20%" width="500%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect x="402" y="150" width="220" height="104" rx="52" fill="#0A0F18" stroke="#3C4E6C" stroke-width="10"/>
  <path d="M512 174 L566 232 H458 Z" fill="#FFD45A" filter="url(#goldGlow)" opacity="0.7"/>
  <path d="M512 174 L566 232 H458 Z" fill="#FFD45A"/>
  <rect x="252" y="292" width="520" height="580" rx="66" fill="#1E293C" stroke="#3C4E6C" stroke-width="18"/>
  <rect x="304" y="344" width="200" height="476" rx="22" fill="url(#doors)"/>
  <rect x="520" y="344" width="200" height="476" rx="22" fill="url(#doors)"/>
  <rect x="494" y="330" width="36" height="504" rx="18" fill="#34D5FF" filter="url(#glow)"/>
  <rect x="505" y="344" width="14" height="476" rx="7" fill="#9BEFFF"/>
</g>
